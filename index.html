<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vestiaire</title>
<meta name="theme-color" content="#E8EAED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vestiaire">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : ticket de vestiaire. Chaque pièce est une étiquette numérotée, la tenue du jour est un ticket détachable. Navigation par barre d’onglets façon iOS, fiches en feuille glissante. */
:root{
  --bg:#E8EAED; --bg-2:#DEE1E5; --surface:#F5F6F7; --card:#FFFFFF;
  --ink:#12151A; --ink-2:#444B56; --ink-3:#747D88;
  --line:#D3D7DD; --line-2:#ADB3BB;
  --accent:#2B43CC; --accent-ink:#FFFFFF; --accent-soft:#DCE2FA;
  --stamp:#E8CD58; --stamp-ink:#2A2306;
  --good:#1E7A4C; --warn:#A8620A; --bad:#B0281F;
  --scrim:rgba(14,16,20,.42); --bar:rgba(245,246,247,.82);
  --display:"Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E11; --bg-2:#15181C; --surface:#14171B; --card:#1A1E23;
    --ink:#E9ECF0; --ink-2:#B3BAC4; --ink-3:#7F8792;
    --line:#252A31; --line-2:#3B424B;
    --accent:#8C9DFF; --accent-ink:#0C0E11; --accent-soft:#222A4B;
    --stamp:#DCC253; --stamp-ink:#1E1904;
    --good:#5CC892; --warn:#E6A84A; --bad:#F07F77;
    --scrim:rgba(0,0,0,.6); --bar:rgba(20,23,27,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E11; --bg-2:#15181C; --surface:#14171B; --card:#1A1E23;
  --ink:#E9ECF0; --ink-2:#B3BAC4; --ink-3:#7F8792;
  --line:#252A31; --line-2:#3B424B;
  --accent:#8C9DFF; --accent-ink:#0C0E11; --accent-soft:#222A4B;
  --stamp:#DCC253; --stamp-ink:#1E1904;
  --good:#5CC892; --warn:#E6A84A; --bad:#F07F77;
  --scrim:rgba(0,0,0,.6); --bar:rgba(20,23,27,.82);
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 112px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);display:flex;align-items:center;gap:12px;padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-stretch:66%;font-weight:860;font-size:23px;letter-spacing:.01em;line-height:1}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnav{display:none;gap:4px;margin-left:12px}
.tnav button{padding:8px 13px;border-radius:999px;font-weight:650;color:var(--ink-2)}
.tnav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tnav svg{display:none}
.spacer{flex:1}
.sync{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
.sync.on i{background:var(--good)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:10px;color:var(--ink-3);font-size:10.5px;font-weight:650;letter-spacing:.01em}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg,.tnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

h1,h2,h3{margin:0;text-wrap:balance}
.big{font-family:var(--display);font-stretch:68%;font-weight:840;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.005em}
.h2{font-family:var(--display);font-stretch:72%;font-weight:820;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.h3{font-family:var(--display);font-stretch:80%;font-weight:760;font-size:14.5px;text-transform:uppercase;letter-spacing:.045em}
.lead{color:var(--ink-2);max-width:62ch;margin:6px 0 0}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.view{display:grid;gap:18px;padding-top:18px;animation:in .28s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:12px;font-weight:680;border:1px solid var(--line-2);background:var(--card);min-height:42px;transition:transform .12s ease}
.btn:active,.chip:active,.tk:active,.icb:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn.wide{flex:1}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:2px;padding:3px;background:var(--bg-2);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:max-content;padding:8px 12px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:640;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;transition:transform .12s ease}
.chip .mono{font-size:10.5px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .mono{color:inherit;opacity:.7}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:680;font-size:13.5px;line-height:1.15;flex:none}
.opt small{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);flex:none}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:20px;color:var(--ink-2);text-align:center}
.note{background:var(--bg-2);border-radius:12px;padding:11px 13px;font-size:13.5px;color:var(--ink-2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.two{display:grid;gap:14px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor;line-height:1.3;white-space:nowrap}
.b-pivot{color:var(--accent)}
.b-surveiller{color:var(--warn)}
.b-vendre{color:var(--bad)}
.b-fonctionnel,.b-garder{color:var(--ink-3)}
.b-new{background:var(--stamp);color:var(--stamp-ink);border-color:var(--stamp)}
.pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;justify-self:start}
.p-hi{background:var(--accent);color:var(--accent-ink)}
.p-md{background:var(--accent-soft);color:var(--ink)}
.p-lo{background:var(--bg-2);color:var(--ink-2)}
.meter{height:6px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s ease}

/* Pièces */
.pic{display:grid;place-items:center;background:var(--bg-2);border-radius:10px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.pic svg{width:72%;height:72%}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tk{position:relative;display:grid;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 11px 11px;transition:transform .15s ease,border-color .15s ease;min-width:0}
.tk::before{content:"";position:absolute;top:8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-2)}
.tk:hover{border-color:var(--line-2)}
.tk .no{position:absolute;top:6px;left:10px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
.tk .vd{position:absolute;top:5px;right:8px}
.tk .pic{margin-bottom:6px}
.tk .nm{font-weight:660;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.tk .br{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .ft{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink-3);gap:6px}
.tk .ft span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.sold{opacity:.5}
.swrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.swrow::-webkit-scrollbar{display:none}
.sw1{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4);position:relative}
.sw1[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.toolbar{display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:10px 0}
.search svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 10px;min-height:44px;max-width:44%}

/* Ticket du jour */
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ticket .head{padding:16px 16px 14px;display:grid;gap:10px}
.ticket .perf{position:relative;height:0;border-top:1.5px dashed var(--line-2);margin-inline:18px}
.ticket .perf::before,.ticket .perf::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .perf::before{left:-30px}
.ticket .perf::after{right:-30px}
.ticket .body{padding:14px 16px 16px;display:grid;gap:12px}
.wx{display:flex;align-items:center;gap:14px}
.wx .t{font-family:var(--mono);font-weight:600;font-size:40px;line-height:.9;letter-spacing:-.03em}
.wx .d{display:grid;gap:2px;font-size:13px;color:var(--ink-2)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.day{flex:none;width:228px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.strip .pic{width:44px;height:44px;border-radius:8px}
.strip .pic svg{width:80%;height:80%}
.tipcard{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}

/* Composer */
.ctl{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.ctl .grp{display:grid;gap:6px;min-width:0}
.opts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.opts::-webkit-scrollbar{display:none}
.compose{display:grid;gap:16px}
@media (min-width:900px){.compose{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:4px;min-width:0}
.ticket .pc{background:var(--surface)}
.pc.locked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc .slot{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pc .open{display:grid;gap:4px;text-align:left}
.pc .nm{font-weight:660;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.pc .br{font-size:12px;color:var(--ink-3)}
.pc .acts{display:flex;gap:6px;margin-top:4px}
.icb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none}
.icb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.summary{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden;min-width:0}
.score{display:flex;align-items:flex-end;gap:12px}
.score .num{font-family:var(--mono);font-weight:600;font-size:54px;line-height:.9;letter-spacing:-.03em}
.score .lbl{font-family:var(--display);font-stretch:70%;font-weight:820;font-size:19px;text-transform:uppercase;line-height:1}
.sil{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--bg-2)}
.sil .silfig{width:22px;height:22px}
.why{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.why li::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:var(--good)}
.why li.w::before{background:var(--warn)}
.mini{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.mini .pic{width:40px;height:40px;flex:none;border-radius:8px}
.mini .pic svg{width:82%;height:82%}
.mini .t{min-width:0;display:grid}
.mini .t b{font-size:13px;font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tips{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tips li{font-size:13.5px;color:var(--ink-2);padding-left:14px;position:relative}
.tips li::before{content:"–";position:absolute;left:0;color:var(--ink-3)}
.stamp{position:absolute;top:16px;right:-34px;transform:rotate(18deg);background:var(--stamp);color:var(--stamp-ink);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;padding:4px 40px;text-transform:uppercase}
.layer{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.layer .pair{display:flex;align-items:center;gap:8px}
.layer .pair .pic{width:44px;height:44px;border-radius:10px}
.layer .pair .pic svg{width:80%;height:80%}
.layer .arrow{font-family:var(--mono);color:var(--ink-3);font-size:11px}

/* Labo */
.palcard{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;align-content:start;min-width:0}
.palbar{display:flex;height:40px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.palbar i{display:block;height:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.fam{display:grid;gap:6px;justify-items:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:620;text-align:center}
.fam .sw{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.fam[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fam .mono{font-size:10px;color:var(--ink-3)}
.partner{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.partner .duo{display:flex;flex:none}
.partner .duo i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.partner .duo i+i{margin-left:-6px}
.partner .t{flex:1;min-width:0;display:grid}
.partner .t b{font-size:13px}
.partner .t span{font-size:12px;color:var(--ink-3)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rule{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;align-content:start}
.rule .n{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.04em}
.rule p{margin:0;color:var(--ink-2);font-size:13.5px}
.silfig{width:56px;height:56px;flex:none;color:var(--ink)}

/* Fiche */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 10px}
@media (min-width:900px){
  .sheet{left:auto;top:0;width:520px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);transform:translateX(102%);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .sheet .grab{display:none}
}
.shd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hero{display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;align-items:center}
.hero .pic{border-radius:14px}
.hero .pic svg{width:76%;height:76%}
.hero h2{font-family:var(--display);font-stretch:74%;font-weight:820;font-size:24px;line-height:1.05;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--ink-3);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0}
.sec{display:grid;gap:8px;margin-top:18px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.mt{flex:none;width:138px;display:grid;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;align-content:start}
.mt .pic{border-radius:8px}
.mt .pic svg{width:70%;height:70%}
.mt b{font-size:12.5px;font-weight:660;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt .rs{font-size:11.5px;color:var(--ink-3);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avoid{display:grid;gap:6px}
.avoid button{display:flex;gap:10px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.avoid .pic{width:38px;height:38px;flex:none;border-radius:8px}
.avoid span{font-size:12.5px;color:var(--ink-3)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--bad);border-radius:12px;font-size:13px}
.list{display:grid;gap:6px}
.lrow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0;text-align:left;width:100%}
.lrow .pic{width:40px;height:40px;flex:none;border-radius:8px}
.lrow .pic svg{width:82%;height:82%}
.lrow .t{flex:1;min-width:0;display:grid;text-align:left}
.lrow .t b{font-size:13.5px;font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t span{font-size:12px;color:var(--ink-3)}
.dna{display:flex;height:36px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.dna i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.wc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start}
.wc .top2{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.wc p{margin:0;color:var(--ink-2);font-size:13.5px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}

/* Formulaire */
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px}
.fld label,.fld .lab{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.fld input[type=text],.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.fld textarea{min-height:120px;font-family:var(--mono);font-size:12px;resize:vertical}
.swp{display:flex;flex-wrap:wrap;gap:7px}
.swp button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.swp button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.swp button.none{background:repeating-linear-gradient(45deg,var(--bg-2) 0 4px,var(--card) 4px 8px)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{position:relative;display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:14px;background:var(--card);cursor:pointer}
.photo .pic{width:76px;height:76px;flex:none;border-radius:12px}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:650;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:all .22s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (min-width:900px){
  .tnav{display:flex}
  .tabbar{display:none}
  .app{padding-block:0 48px}
  .toast{bottom:28px}
  .big{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const SLOT_ORDER = ["outer","suit","mid","base","bottom","shoes"];
function slotOf(i){
  if (i.cat === "haut") return "base";
  if (i.cat === "maille") return i.base ? "base" : "mid";
  if (i.cat === "veste") return "outer";

let seed = (Date.now() % 2147483646) + 1;
function rng(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function accents(list){ const s = new Set(); for (const i of list) for (const f of [i.fam, ...i.fa]) if (grp(f) === "A" || f === "multi") s.add(f); return s.size; }
function famCount(list){ const s = new Set(); for (const i of list) if (i.cat !== "chaussures") s.add(i.fam); return s.size; }
function poolFor(slot, cfg, used){
  const W = WEATHER[cfg.weather], V = VIBES[cfg.vibe];
  let items = owned().filter(i => usable(i) && !used.has(i.id));
  const seasonOK = i => i.s.some(x => W.s.includes(x));
  const fOK = i => rdist(i.f, [V.f-.6, V.f+.6]) <= .9;
  if (slot === "base") items = items.filter(i => (i.cat === "haut" && i.t !== "tank") || (i.cat === "maille" && i.base && cfg.weather !== "chaud"));
  else if (slot === "mid") items = items.filter(i => i.cat === "maille" && !i.base && !(i.t === "hoodie" && !["street","chill"].includes(cfg.vibe)));
  else if (slot === "outer") items = items.filter(i => i.cat === "veste" && (cfg.weather !== "froid" || i.s.includes("hiver")) && !(cfg.weather === "doux" && ["coat","puffer"].includes(i.t)));
  else if (slot === "bottom") items = items.filter(i => i.cat === "bas");
  else if (slot === "suit") items = items.filter(i => i.cat === "costume");
  else if (slot === "shoes") items = items.filter(i => i.cat === "chaussures");
  items = items.filter(i => seasonOK(i) && fOK(i));
  if (cfg.ban) items = items.filter(i => !cfg.ban.has(i.id));
  if (cfg.palette && slot !== "shoes"){
    const P = PAL.find(p => p.k === cfg.palette);
    if (P){ const pal = items.filter(i => P.allow.includes(i.fam)); if (pal.length) items = pal; }
  }
  return items;
}
function candScore(c, chosen, cfg){
  const V = VIBES[cfg.vibe];
  let s = chosen.length ? chosen.reduce((a,o) => a + pairScore(c,o).s, 0) / chosen.length / 100 : .75;
  s += c.u.some(u => V.u.includes(u)) ? .08 : -.04;
  s -= .035 * Math.abs(mid(c.f) - V.f);
  if (c.v === "pivot") s += .02;
  const acc = accents([...chosen, c]); if (acc > 2) s -= .1*(acc-2);
  if (famCount([...chosen, c]) > 4) s -= .05;
  const ds = daysSince(c.id); if (ds !== null){ if (ds <= 2) s -= .07; else if (ds <= 5) s -= .03; }
  if (cfg.rain && c.rain) s += .06;
  return s + (rng()-.5)*.05;
}
function pickFrom(list, chosen, cfg, exclude){
  const sc = list.filter(c => !(exclude && exclude.has(c.id))).map(c => ({c, s:candScore(c, chosen, cfg)})).sort((a,b) => b.s - a.s);
  if (!sc.length) return null;
  const top = sc.slice(0,5), w = top.map(x => Math.exp((x.s - top[0].s)*14));
  let r = rng()*w.reduce((a,b) => a+b, 0);
  for (let k = 0; k < top.length; k++){ r -= w[k]; if (r <= 0) return top[k].c; }
  return top[0].c;
}
function planSlots(cfg, locked){
  const p = [];
  const suit = !!locked.suit || (cfg.vibe === "corpo" && !locked.bottom && rng() < (cfg.weather === "chaud" ? .6 : .92));
  p.push(suit ? "suit" : "bottom"); p.push("base");
  const Wk = cfg.weather;
  if (Wk === "froid"){ if (!suit) p.push("mid"); p.push("outer"); }
  else if (Wk === "frais" && !suit){ const r = rng(); if (r < .4) p.push("mid"); else if (r < .75) p.push("outer"); else p.push("mid","outer"); }
  else if (Wk === "doux" && !suit){ const r = rng(); if (r < .3) p.push("mid"); else if (r < .6) p.push("outer"); }
  if (cfg.rain && !p.includes("outer") && Wk !== "chaud") p.push("outer");
  p.push("shoes");
  for (const k in locked) if (!p.includes(k)) p.push(k);
  return p;
}
function restrictSuit(pool, slot, pieces){
  if (slot === "base" && pieces.suit) return pool.filter(i => ["shirt","turtleneck","polols","polo"].includes(i.t));
  if (slot === "outer" && pieces.suit) return pool.filter(i => i.t === "coat" || i.t === "trench");
  if (slot === "mid" && pieces.suit) return pool.filter(i => ["zip","sweater","vest","cardigan"].includes(i.t) && i.f[1] >= 4);

}
function buildOutfit(cfg, prev){
  cfg = Object.assign({}, cfg);
  const locked = Object.assign({}, cfg.locked || {});
  for (const k in locked) if (!byId(locked[k]) || isSold(byId(locked[k]))) delete locked[k];
  cfg.locked = locked;
  const slots = planSlots(cfg, locked);
  const pieces = {}; const chosen = []; const used = new Set();
  for (const k of slots) if (locked[k]){ const it = byId(locked[k]); pieces[k] = it.id; chosen.push(it); used.add(it.id); }
  const order = ["suit","bottom","base","outer","mid","shoes"].filter(k => slots.includes(k) && !pieces[k]);
  for (const k of order){
    const pool = restrictSuit(poolFor(k, cfg, used), k, pieces);
    const ex = prev && prev.avoid && prev.avoid[k] ? new Set(prev.avoid[k]) : null;
    const c = pickFrom(pool, chosen, cfg, ex) || pickFrom(pool, chosen, cfg, null);
    if (c){ pieces[k] = c.id; chosen.push(c); used.add(c.id); }
  }
  const out = {cfg:{vibe:cfg.vibe, weather:cfg.weather, moment:cfg.moment, locked, palette:cfg.palette||null, rain:!!cfg.rain}, pieces};
  finishOutfit(out); return out;
}
function rerollSlot(out, slot){
  const cfg = out.cfg; const chosen = []; const used = new Set();
  for (const k in out.pieces) if (k !== slot){ const it = byId(out.pieces[k]); if (it){ chosen.push(it); used.add(it.id); } }
  const pool = restrictSuit(poolFor(slot, cfg, used), slot, out.pieces);
  out.tried = out.tried || {};
  const tried = new Set(out.tried[slot] || []); if (out.pieces[slot]) tried.add(out.pieces[slot]);
  let c = pickFrom(pool, chosen, cfg, tried);
  if (!c){ tried.clear(); if (out.pieces[slot]) tried.add(out.pieces[slot]); c = pickFrom(pool, chosen, cfg, tried); }
  if (c){ out.pieces[slot] = c.id; tried.add(c.id); out.tried[slot] = [...tried]; }
  finishOutfit(out); return out;
}

function silOf(out){

  const bottom = (p.bottom && byId(p.bottom)) || (p.suit && byId(p.suit));

  const topVis = midp || base;
  if (base && bottom && base.fam === bottom.fam && outer && outer.fam !== base.fam) key = "colonne";
  else if (outer && (outer.len === "mi" || outer.len === "long")) key = "vertical";
  else if (outer && outer.len === "court" && wide(bottom)) key = "jambes";
  else if (midp && outer) key = "couches";
  else if (!outer && wide(bottom) && topVis && topVis.vol === "oversize") key = "bloc";
  else if (!outer && wide(bottom) && topVis && topVis.vol !== "oversize") key = "v";
  if (key === "bloc" && !["street","chill"].includes(out.cfg.vibe)){ bonus -= 3; tags.push({g:0,x:"Volume sur volume dans une tenue habillée"}); }
  else if (key !== "droit") bonus += 2;

  if (layers.length >= 2){

function harmony(list, out){
  if (list.length < 2) return {h:0, good:[], warn:[], sil:"droit"};
  let sum = 0, n = 0, lo = 100; const tagMap = new Map(), warn = new Map();
  for (let i = 0; i < list.length; i++) for (let j = i+1; j < list.length; j++){
    const r = pairScore(list[i], list[j]); sum += r.s; n++; if (r.s < lo) lo = r.s;
    for (const t of r.tags){ if (t.g){ const prev = tagMap.get(t.x) || 0; tagMap.set(t.x, Math.max(prev, r.s)); } else warn.set(t.x, (warn.get(t.x)||0)+1); }
  }
  let h = .55*(sum/n) + .45*lo - 4; const acc = accents(list); if (acc > 2) h -= 5*(acc-2);
  const fc = famCount(list); if (fc > 4) h -= 3;
  const sil = out ? silOf(out) : {key:"droit", bonus:0, tags:[]};
  h += sil.bonus;
  for (const t of sil.tags){ if (t.g) tagMap.set(t.x, 99); else warn.set(t.x, 1); }
  const skip = new Set(["Même niveau d’habillé","Le neutre laisse respirer","Mélange de registres maîtrisé"]);
  const vb = out && VIBES[out.cfg.vibe];
  for (const k of [...tagMap.keys()]) if (k.startsWith("Esprit ") && !(vb && k === "Esprit " + vb.label.toLowerCase())) tagMap.delete(k);
  const good = [...tagMap.entries()].sort((a,b) => (skip.has(a[0]) - skip.has(b[0])) || b[1]-a[1]).map(e => e[0]).slice(0,5);
  const w = [...warn.keys()].slice(0,2);
  if (acc > 2) w.push(acc+" couleurs vives, c’est beaucoup");
  if (fc > 4) w.push("Plus de 4 couleurs, vise 3 maximum");
  return {h: Math.round(Math.max(0, Math.min(100, h))), good, warn: w, sil: sil.key};
}

function finishOutfit(out){

  if (has("a08") && (V.f >= 3 || moment === "soir" || rng() < .5)) acc.push("a08");
  if (has("a10")) acc.push("a10");

    const ties = owned().filter(i => (i.t === "tie" || i.t === "knittie") && !isSold(i) && i.v !== "vendre" && (i.v !== "fonctionnel" || (suit && suit.fam === "noir")));

  tips.push("Barbe : huile et peigne, contours nets.");

  else tips.push("Cheveux : spray boucles seulement, garde du mouvement.");

function buildWeek(vibes, weather, rain){
  const ban = new Set(); const days = [];

    WX.max = Math.round(j.daily.temperature_2m_max[0]); WX.min = Math.round(j.daily.temperature_2m_min[0]);
    WX.rain = isRain(WX.code) || (j.daily.precipitation_probability_max && j.daily.precipitation_probability_max[0] >= 60);
    WX.place = pos ? "Autour de toi" : "Paris"; WX.at = Date.now(); WX.err = "";
    lsSet(LS_WX, WX);
    if (ui.wxMode === "auto"){ const c = wxCat(Math.round((WX.feels + WX.max)/2)); if (c && c !== ui.weather){ ui.weather = c; saveUI(); TODAY = null; OUT = null; } }
    if (ui.tab === "today") render();
  } catch(e){ WX.err = "off"; if (ui.tab === "today") render(); }
}

}

        <div class="opts">${Object.keys(VIBES).map(k => `<button class="chip" data-act="tvibe" data-k="${k}" aria-pressed="${ui.vibe === k}">${VIBES[k].label}</button>`).join("")}<button class="chip" data-act="tmoment" aria-pressed="${ui.moment === "soir"}">${ui.moment === "soir" ? "Ce soir" : "Journée"}</button></div>

/* ---- Dressing ---- */

  const foot = i.cat === "parfum" ? esc(i.olf || "") : i.cat === "soin" ? esc((i.use||"").split(" · ")[0]) : sc != null ? sc+" accords forts" : esc(i.s.length === 3 ? "Toutes saisons" : i.s.map(s => SEASON_LBL[s]).join(" · "));
  return `<button class="tk${isSold(i) ? " sold" : ""}" data-act="open" data-id="${i.id}"><span class="no">N°${esc(i.id.toUpperCase().slice(0,6))}</span><span class="vd">${isSold(i) ? '<span class="badge b-garder">Vendu</span>' : verdictBadge(i)}</span>${pic(i)}<span class="nm">${esc(i.n)}</span><span class="br">${esc(bc(i))}</span><span class="ft"><span>${foot}</span><span class="dot" style="background:${esc(i.col[0])}"></span></span></button>`;
}
function vDressing(){
  const all = owned();
  const q = ui.q.trim().toLowerCase();
  const visible = i => (ui.showMisc || (i.v !== "fonctionnel" && !isSold(i)));
  const counts = {}; for (const i of all) if (visible(i)) counts[i.cat] = (counts[i.cat]||0) + 1;
  const total = all.filter(visible).length;
  let list = all.filter(visible).filter(i => ui.cat === "all" || i.cat === ui.cat);
  if (ui.fam) list = list.filter(i => i.fam === ui.fam || i.fa.includes(ui.fam));
  if (q) list = list.filter(i => (i.n+" "+i.b+" "+(FAM[i.fam] ? FAM[i.fam].n : "")+" "+i.u.map(u => UNIV_LBL[u]||"").join(" ")+" "+(i.olf||"")).toLowerCase().includes(q));
  const catSort = (a,b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat);
  if (ui.sort === "accords") list.sort((a,b) => (CLOTHES.includes(b.cat) ? strongCount(b) : -1) - (CLOTHES.includes(a.cat) ? strongCount(a) : -1));
  else if (ui.sort === "couleur") list.sort((a,b) => lum(b.col[0]) - lum(a.col[0]));
  else if (ui.sort === "porte") list.sort((a,b) => (daysSince(a.id) ?? 9999) - (daysSince(b.id) ?? 9999));
  else list.sort((a,b) => catSort(a,b) || ((a.v === "pivot" ? -1 : 0) - (b.v === "pivot" ? -1 : 0)) || a.id.localeCompare(b.id));
  const famsOwned = [...new Set(all.filter(i => CLOTHES.includes(i.cat) && visible(i)).map(i => i.fam))].filter(f => FAM[f] && f !== "multi");
  const routine = ui.cat === "soin" ? `<div class="rules">

  return `<section class="view">

    <div class="chips"><button class="chip" data-act="cat" data-k="all" aria-pressed="${ui.cat === "all"}">Tout <span class="mono">${total}</span></button>${CAT_ORDER.filter(c => counts[c]).map(c => `<button class="chip" data-act="cat" data-k="${c}" aria-pressed="${ui.cat === c}">${CAT_LBL[c]} <span class="mono">${counts[c]}</span></button>`).join("")}</div>
    <div class="swrow"><button class="chip" data-act="famf" data-k="" aria-pressed="${!ui.fam}">Toutes couleurs</button>${famsOwned.map(f => `<button class="sw1" data-act="famf" data-k="${f}" aria-pressed="${ui.fam === f}" style="background:${FAM[f].h}" title="${FAM[f].n}" aria-label="${FAM[f].n}"></button>`).join("")}</div>

  </section>`;
}

      <div class="grp"><span class="eyebrow">Météo</span><div class="opts">${Object.keys(WEATHER).map(k => `<button class="opt" data-act="cfg" data-g="weather" data-k="${k}" aria-pressed="${o.cfg.weather === k}">${WEATHER[k].label}<small>${WEATHER[k].hint}</small></button>`).join("")}</div></div>
      <div class="grp"><span class="eyebrow">Palette</span><div class="opts"><button class="chip" data-act="cfg" data-g="palette" data-k="" aria-pressed="${!o.cfg.palette}">Libre</button>${PAL.map(p => `<button class="chip" data-act="cfg" data-g="palette" data-k="${p.k}" aria-pressed="${o.cfg.palette === p.k}"><span class="dot" style="background:${FAM[p.roles[0][0]].h}"></span>${esc(p.n)}</button>`).join("")}</div></div>
      <div class="between" style="align-items:center"><div class="seg" style="flex:none">${["jour","soir"].map(k => `<button data-act="cfg" data-g="moment" data-k="${k}" aria-pressed="${o.cfg.moment === k}">${k === "jour" ? "Jour" : "Soir"}</button>`).join("")}</div><button class="btn ink" data-act="reroll">${ICO.dice}<span>Nouvelle tenue</span></button></div>

      <div class="sec" style="margin-top:0"><span class="h3">Pourquoi ça marche</span><ul class="why">${h.good.map(x => `<li>${esc(x)}</li>`).join("")}${h.warn.map(x => `<li class="w">${esc(x)}</li>`).join("")}</ul></div>
      ${accs.length ? `<div class="sec" style="margin-top:0"><span class="h3">Accessoires</span><div class="minis">${accs.map(a => `<button class="mini" data-act="open" data-id="${a.id}">${pic(a)}<span class="t"><b>${esc(a.n)}</b><span>${esc(bc(a))}</span></span></button>`).join("")}</div></div>` : ""}

/* ---- Labo ---- */
function vLabo(){
  const seg = `<div class="seg">${[["couleurs","Couleurs"],["palettes","Palettes"],["silhouettes","Silhouettes"],["parfums","Parfums"],["regles","Règles"]].map(([k,l]) => `<button data-act="labo" data-k="${k}" aria-pressed="${ui.labo === k}">${l}</button>`).join("")}</div>`;
  let body;
  if (ui.labo === "couleurs") body = laboColors();
  else if (ui.labo === "palettes") body = laboPalettes();
  else if (ui.labo === "silhouettes") body = laboSil();
  else if (ui.labo === "parfums") body = laboPerf();
  else body = `<div class="rules">${RULES.map((r,k) => `<div class="rule"><span class="n">${String(k+1).padStart(2,"0")} · ${esc(r.src)}</span><span class="h3">${esc(r.t)}</span><p>${esc(r.d)}</p></div>`).join("")}</div>`;
  return `<section class="view"><div><h1 class="big">Labo</h1><p class="lead">Les règles de couleur, de silhouette et de parfum appliquées à ton vestiaire. Tout ce qui est ici nourrit le moteur.</p></div>${seg}${body}</section>`;
}
function laboColors(){
  const items = owned().filter(i => CLOTHES.includes(i.cat) && usable(i));
  const cnt = {}; for (const i of items) cnt[i.fam] = (cnt[i.fam]||0)+1;
  const fams = Object.keys(FAM).filter(f => f !== "multi");
  const sel = FAM[ui.famSel] ? ui.famSel : "marine";
  const partners = fams.filter(f => f !== sel).map(f => ({f, s:cmp(sel,f)})).sort((a,b) => b.s - a.s);
  const top = partners.slice(0,8), worst = partners.slice(-3).reverse();
  const tot = items.length || 1;
  const sorted = Object.entries(cnt).sort((a,b) => b[1]-a[1]);
  const pl = n => n+" pièce"+(n > 1 ? "s" : "");
  return `<div class="panel"><div class="between"><span class="h3">Ton ADN couleur</span><span class="eyebrow">${items.length} pièces actives</span></div>
    <div class="dna">${sorted.map(([f,n]) => `<i style="width:${(n/tot*100).toFixed(2)}%;background:${FAM[f] ? FAM[f].h : "#888"}" title="${esc((FAM[f]?FAM[f].n:f)+" · "+n)}"></i>`).join("")}</div>
    <div class="legend">${sorted.map(([f,n]) => `<span><i class="dot" style="background:${FAM[f] ? FAM[f].h : "#888"}"></i>${esc(FAM[f]?FAM[f].n:f)} <span class="mono">${n}</span></span>`).join("")}</div></div>

function impact(w){
  if (w.t === "belt"){
    const shoes = owned().filter(i => i.cat === "chaussures" && i.fam === w.fam && usable(i)).length;
    const bottoms = owned().filter(i => i.cat === "bas" && i.t === "trousers" && i.f[1] >= 3 && usable(i)).length;
    return shoes * bottoms;
  }
  const m = matchesFor(w); let n = 0;
  for (const k in m) n += m[k].filter(e => e.r.s >= 85).length;
  const fc = owned().filter(i => CLOTHES.includes(i.cat) && usable(i) && i.fam === w.fam).length;
  return Math.round(n * (fc <= 3 ? 1.35 : 1));
}

function closeSheet(){ stack.length = 0; draft = null; ui.confirmDel = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
function renderSheet(){
  const top = stack[stack.length-1]; if (!top) return;
  const head = `<div class="grab"></div><div class="shd">${stack.length > 1 ? `<button class="icb" data-act="back" aria-label="Retour">${ICO.back}</button>` : ""}<span class="spacer"></span><button class="icb" data-act="close" aria-label="Fermer">${ICO.x}</button></div>`;

function sItem(x){
  if (!x) return '<div class="empty">Cette pièce n’existe plus.</div>';
  const kv = [];
  kv.push(["Catégorie", CAT_ONE[x.cat]]);
  if (x.cat !== "soin") kv.push(["Couleur", (FAM[x.fam] ? FAM[x.fam].n : "") + (x.fa && x.fa.length ? " · "+x.fa.map(f => FAM[f] ? FAM[f].n : f).join(", ") : "")]);
  if (CLOTHES.includes(x.cat) || x.cat === "accessoire") kv.push(["Registre", x.f[0] === x.f[1] ? FORM_LBL[x.f[0]] : FORM_LBL[x.f[0]]+" à "+FORM_LBL[x.f[1]].toLowerCase()]);
  if (x.u.length) kv.push(["Univers", x.u.map(u => UNIV_LBL[u]).join(", ")]);
  if (x.cat !== "soin") kv.push(["Saisons", x.s.length === 3 ? "Toutes" : x.s.map(s => SEASON_LBL[s]).join(", ")]);
  if (x.vol && x.cat !== "chaussures") kv.push(["Volume", {ajuste:"Ajusté",regular:"Regular",boxy:"Boxy",oversize:"Oversize",large:"Large",barrel:"Barrel",droit:"Droit",fusele:"Fuselé",short:"Short"}[x.vol] || x.vol]);
  if (x.len) kv.push(["Longueur", {court:"Courte, au-dessus des hanches",hanche:"Aux hanches",mi:"Mi-cuisse",long:"Longue"}[x.len]]);
  if (x.olf) kv.push(["Famille", x.olf]);
  if (x.notes){ if (x.notes[0]) kv.push(["Tête", x.notes[0]]); if (x.notes[1]) kv.push(["Cœur", x.notes[1]]); if (x.notes[2]) kv.push(["Fond", x.notes[2]]); }
  if (x.m && x.m.length) kv.push(["Moment", x.m.map(m => m === "jour" ? "Jour" : "Soir").join(", ")]);
  if (x.sill) kv.push(["Sillage", ["","Discret","Moyen","Fort"][x.sill]]);
  if (x.use) kv.push(["Usage", x.use]);
  const ds = daysSince(x.id);
  if (ds !== null && (CLOTHES.includes(x.cat) || x.cat === "parfum")) kv.push(["Dernière fois", ds === 0 ? "Aujourd’hui" : ds === 1 ? "Hier" : "Il y a "+ds+" jours"]);
  let html = `<div class="hero">${pic(x)}<div style="display:grid;gap:6px;min-width:0"><span class="eyebrow">N°${esc(x.id.toUpperCase().slice(0,6))}${x.wish ? " · pièce à acheter" : ""}</span><h2>${esc(x.n)}</h2><span style="color:var(--ink-3)">${esc(bc(x))}</span><div class="row">${isSold(x) ? '<span class="badge b-garder">Vendu</span>' : verdictBadge(x)}</div></div></div>
    <dl class="kv" style="margin-top:14px">${kv.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;

  if (!x.wish && (CLOTHES.includes(x.cat) || x.cat === "accessoire" || x.cat === "parfum") && !isSold(x)) acts.push(`<button class="btn sm" data-act="wearone" data-id="${x.id}">Porté aujourd’hui</button>`);
  if (x.wish && !U.bought[x.id]) acts.push(`<button class="btn pri sm" data-act="buy" data-id="${x.id}">Je l’ai acheté</button>`);
  if (!x.wish && x.cat !== "soin") acts.push(`<button class="btn sm" data-act="edit" data-id="${x.id}">${ICO.edit}<span>Modifier</span></button>`);
  if (!x.wish && x.cat !== "soin") acts.push(isSold(x) ? `<button class="btn sm ghost" data-act="unsold" data-id="${x.id}">Remettre dans le dressing</button>` : `<button class="btn sm ghost" data-act="sold" data-id="${x.id}">Marquer vendu</button>`);
  if (x.custom) acts.push(ui.confirmDel === x.id ? `<span class="confirm">Supprimer définitivement ? <button class="btn sm" data-act="delcustom" data-id="${x.id}">Supprimer</button><button class="btn sm ghost" data-act="nodelc">Annuler</button></span>` : `<button class="btn sm ghost" data-act="askdel" data-id="${x.id}">Supprimer</button>`);
  if (acts.length) html += `<div class="row" style="margin-top:14px">${acts.join("")}</div>`;
  if (x.cat === "parfum"){
    if (x.v === "vendre") return html + `<div class="sec"><span class="h3">Verdict</span><div class="note">Sors-le de ta rotation et mets-le en vente. Un flacon entamé d’extrait se revend correctement.</div></div>`;

    html += `<div class="sec"><span class="h3">Quand le porter</span><div class="note">${esc((x.s.length === 3 ? "Toute l’année" : x.s.map(s => SEASON_LBL[s]).join(" et "))+", "+((x.m||[]).length === 2 ? "jour comme soir" : (x.m||[])[0] === "soir" ? "plutôt le soir" : "plutôt en journée")+(vibes ? ". Avec une tenue "+vibes.toLowerCase()+"." : "."))}${x.sill >= 3 ? " Sillage fort, dose léger au bureau." : ""}</div></div>`;
    const lays = LAYERS.filter(L => L.a === x.id || L.b === x.id);

function nearestFam(r,g,b){
  let best = "noir", bd = 1e9;
  for (const f of Object.keys(FAM)){
    if (f === "multi") continue;
    const h = FAM[f].h.slice(1); const R = parseInt(h.slice(0,2),16), G = parseInt(h.slice(2,4),16), Bc = parseInt(h.slice(4,6),16);
    const rm = (r + R)/2; const dr = r-R, dg = g-G, db = b-Bc;
    const d = (2 + rm/256)*dr*dr + 4*dg*dg + (2 + (255-rm)/256)*db*db;
    if (d < bd){ bd = d; best = f; }
  }
  return best;
}
async function readPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const S = 120, c = document.createElement("canvas"); c.width = S; c.height = S;
    const ctx = c.getContext("2d"); const r = Math.max(S/img.width, S/img.height); const w = img.width*r, h = img.height*r;
    ctx.drawImage(img, (S-w)/2, (S-h)/2, w, h);
    const thumb = c.toDataURL("image/jpeg", .62);
    const data = ctx.getImageData(Math.round(S*.25), Math.round(S*.22), Math.round(S*.5), Math.round(S*.56)).data;
    const px = []; for (let k = 0; k < data.length; k += 8) px.push([data[k], data[k+1], data[k+2]]);
    let cents = [px[0], px[Math.floor(px.length/2)], px[px.length-1]].map(p => p.slice());
    const assign = new Array(px.length).fill(0);
    for (let it = 0; it < 8; it++){
      for (let k = 0; k < px.length; k++){ let bi = 0, bd = 1e9; for (let j = 0; j < cents.length; j++){ const d = (px[k][0]-cents[j][0])**2 + (px[k][1]-cents[j][1])**2 + (px[k][2]-cents[j][2])**2; if (d < bd){ bd = d; bi = j; } } assign[k] = bi; }
      cents = cents.map((cc,j) => { const m = px.filter((_,k) => assign[k] === j); if (!m.length) return cc; return [0,1,2].map(ch => m.reduce((a,p) => a + p[ch], 0)/m.length); });
    }
    const counts = cents.map((_,j) => assign.filter(a => a === j).length);
    const j = counts.indexOf(Math.max(...counts)); const [R,G,Bc] = cents[j].map(Math.round);
    const hex = "#" + [R,G,Bc].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
    return {thumb, hex, fam: nearestFam(R,G,Bc)};
  } finally { URL.revokeObjectURL(url); }
}

    case "otherToday": TODAY = bestOf(curCfg({palette:null}), null, 6); render(); break;
    case "wearToday": logWear(outfitIds(TODAY)); toast("Noté pour aujourd’hui"); render(); break;
    case "toComposer": OUT = JSON.parse(JSON.stringify(TODAY)); OUT.cfg.locked = {}; finishOutfit(OUT); ui.tab = "composer"; saveUI(); render(); window.scrollTo(0,0); break;
    case "weekVibe": { const order = Object.keys(VIBES); const cur = ui.weekVibes[+k]; ui.weekVibes[+k] = order[(order.indexOf(cur)+1) % order.length]; saveUI(); render(); break; }
    case "planWeek": U.week = buildWeek(ui.weekVibes.slice(), ui.weather, ui.wxMode === "auto" && !!WX.rain); persist(); render(); toast("Semaine planifiée"); break;
    case "dayVibe": { const order = Object.keys(VIBES); const dd = U.week.days[+k]; dd.vibe = order[(order.indexOf(dd.vibe)+1) % order.length]; ui.weekVibes[+k] = dd.vibe; saveUI(); rebuildDay(+k); persist(); render(); break; }
    case "rerollDay": rebuildDay(+k); persist(); render(); break;
    case "openDay": { const dd = U.week.days[+k]; OUT = {cfg:{vibe:dd.vibe, weather:U.week.weather, moment:"jour", locked:{}, palette:null, rain:false}, pieces:Object.assign({}, dd.pieces)}; finishOutfit(OUT); ui.tab = "composer"; saveUI(); render(); window.scrollTo(0,0); break; }
    case "build": {
      const it = byId(id); const s = slotOf(it);
      let vibe = ui.vibe; if (!it.u.includes(vibe)){ const pref = ["casual","smart","oldmoney","street","corpo","chill"].find(v => it.u.includes(v)); if (pref) vibe = pref; }
      let weather = ui.weather; const allowed = Object.keys(WEATHER).filter(w => it.s.some(x => WEATHER[w].s.includes(x))); if (!allowed.includes(weather)) weather = allowed[0] || weather;
      ui.vibe = vibe; ui.weather = weather; ui.tab = "composer"; saveUI();
      OUT = buildOutfit(curCfg({vibe, weather, locked:{[s]:it.id}, palette:null}));
      closeSheet(); render(); window.scrollTo(0,0); break;
    }
    case "wear": logWear(outfitIds(OUT)); toast("Noté pour aujourd’hui"); break;
    case "wearone": logWear([id]); toast("Noté pour aujourd’hui"); if (stack.length) renderSheet(); break;
    case "savelook": {
      const items = SLOT_ORDER.filter(s => OUT.pieces[s]).map(s => OUT.pieces[s]);
      U.looks.push({id:"l"+Date.now(), date:today(), vibe:OUT.cfg.vibe, weather:OUT.cfg.weather, moment:OUT.cfg.moment, items, pieces:Object.assign({}, OUT.pieces), acc:OUT.acc||[], perfume:OUT.perfume||null, layer:OUT.layer||null, h:OUT.harm.h});
      if (U.looks.length > 200) U.looks.shift();
      persist(); toast("Tenue ajoutée au lookbook"); break;
    }
    case "reopen": {
      const l = U.looks.find(x => x.id === id); if (!l) break;
      ui.vibe = l.vibe; ui.weather = l.weather; ui.moment = l.moment || "jour"; ui.tab = "composer"; saveUI();
      const pieces = Object.assign({}, l.pieces || {});
      if (!l.pieces) for (const pid of l.items){ const it = byId(pid); if (it) pieces[slotOf(it)] = pid; }
      for (const s in pieces) if (!byId(pieces[s]) || isSold(byId(pieces[s]))) delete pieces[s];
      OUT = {cfg:{vibe:l.vibe, weather:l.weather, moment:l.moment || "jour", locked:Object.assign({}, pieces), palette:null, rain:false}, pieces};
      finishOutfit(OUT); render(); window.scrollTo(0,0); break;
    }
    case "wearlook": { const l = U.looks.find(x => x.id === id); if (l){ logWear([...l.items, ...(l.acc||[]), ...(l.perfume ? [l.perfume] : [])]); toast("Noté pour aujourd’hui"); } break; }
    case "asklook": ui.confirmLook = id; render(); break;
    case "nodel": ui.confirmLook = null; render(); break;
    case "dellook": U.looks = U.looks.filter(x => x.id !== id); ui.confirmLook = null; persist(); render(); toast("Tenue supprimée"); break;
    case "sold": U.sold[id] = today(); invalidate(); persist(); OUT = null; TODAY = null; render(); if (stack.length) renderSheet(); toast("Marqué vendu"); break;
    case "unsold": delete U.sold[id]; invalidate(); persist(); render(); if (stack.length) renderSheet(); toast("Remis dans le dressing"); break;
    case "buy": U.bought[id] = today(); invalidate(); persist(); render(); if (stack.length) renderSheet(); toast("Ajouté à ton dressing"); break;
    case "unbuy": delete U.bought[id]; invalidate(); persist(); render(); toast("Retiré du dressing"); break;
    case "labo": ui.labo = k; saveUI(); render(); break;
    case "famsel": ui.famSel = k; saveUI(); render(); break;
    case "tryPal": { const P = PAL.find(p => p.k === k); ui.palette = k; ui.vibe = P.vibe; saveUI(); OUT = bestOf(curCfg({vibe:P.vibe, palette:k}), null, 25); ui.tab = "composer"; saveUI(); render(); window.scrollTo(0,0); break; }
    case "trySil": { const c = SIL_CFG[k]; const o = bestOf(curCfg({vibe:c.vibe, weather:c.weather, palette:null}), SIL_TEST[k], 80); if (!o){ toast("Pas assez de pièces pour cette silhouette"); break; } ui.vibe = c.vibe; ui.weather = c.weather; ui.wxMode = "manuel"; ui.palette = ""; OUT = o; ui.tab = "composer"; saveUI(); render(); window.scrollTo(0,0); break; }
    case "moi": ui.moi = k; saveUI(); render(); break;
    case "add": draft = newDraft(); openSheet("form", null, false); break;
    case "edit": draft = draftFrom(byId(id)); stack.push({kind:"form"}); renderSheet(); $("#sheet").scrollTop = 0; break;
    case "resetEdit": delete U.edits[id]; delete U.photos[id]; invalidate(); persist(); stack.pop(); renderSheet(); render(); toast("Fiche d’origine rétablie"); break;
    case "fset": readForm(); draft[el.dataset.f] = k; if (el.dataset.f === "fam") draft.hex = null; renderSheet(); break;
    case "uset": readForm(); draft.u = draft.u.includes(k) ? draft.u.filter(x => x !== k) : [...draft.u, k]; renderSheet(); break;
    case "sset": readForm(); draft.s = draft.s.includes(k) ? draft.s.filter(x => x !== k) : [...draft.s, k]; renderSheet(); break;
    case "askdel": ui.confirmDel = id; renderSheet(); break;
    case "nodelc": ui.confirmDel = null; renderSheet(); break;
    case "delcustom": U.custom = U.custom.filter(c => c.id !== id); delete U.photos[id]; ui.confirmDel = null; invalidate(); persist(); closeSheet(); render(); toast("Pièce supprimée"); break;
    case "exportCopy": { const t = exportPayload(); if (await copyText(t)) toast("Sauvegarde copiée"); else { openSheet("import", null, false); const ta = $("#imp"); if (ta){ ta.value = t; ta.focus(); ta.select(); } toast("Sélectionne le texte et copie-le"); } render(); break; }
    case "exportFile": await exportFile(); render(); break;
    case "importOpen": openSheet("import", null, false); break;
    case "importText": { const r = importData(($("#imp")||{}).value || ""); if (typeof r === "string"){ $("#imp-err").textContent = r; } else { closeSheet(); render(); toast(r.msg); } break; }
    case "importFile": $("#filein").click(); break;
    case "askreset": ui.confirmReset = true; render(); break;
    case "noreset": ui.confirmReset = false; render(); break;
    case "reset": U = normU(null); ui.confirmReset = false; invalidate(); persist(); OUT = null; TODAY = null; render(); toast("Données effacées"); break;
  }
}

/* =================== Stockage =================== */
const store = {ref:null, writing:false, pending:false, timer:null, last:""};
function setSync(){
  const el = $("#sync"); if (!el) return;
  el.classList.toggle("on", !!store.ref);
  el.querySelector("span").textContent = store.ref ? "Synchronisé" : "Sur cet appareil";
  el.title = store.ref ? "Tes données te suivent sur tous tes appareils connectés à Claude." : "Tes données sont gardées sur cet appareil. Pense à exporter une sauvegarde de temps en temps.";
}
function persist(){
  lsSet(LS_KEY, U);
  if (!store.ref) return;
  clearTimeout(store.timer); store.timer = setTimeout(doWrite, 600);
}
async function doWrite(){
  if (!store.ref) return;
  if (store.writing){ store.pending = true; return; }
  store.writing = true;
  const body = JSON.parse(JSON.stringify(U));
  try { await store.ref.set(body); store.last = JSON.stringify(body); }
  catch (e) {
    const code = e && e.code;
    if (code === "unavailable") setTimeout(doWrite, 1200 + Math.random()*800);
    else if (code === "quota_exceeded" || code === "invalid_argument") toast("Stockage plein. Supprime quelques photos ou tenues.");
    else { store.ref = null; setSync(); }
  } finally {
    store.writing = false;
    if (store.pending){ store.pending = false; doWrite(); }
  }
}
async function initStore(){
  const local = lsGet(LS_KEY); if (local){ U = normU(local); invalidate(); }
  setSync();
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/state");
    const snap = await ref.get();
    store.ref = ref; setSync();
    if (snap.exists){ U = normU(snap.data()); lsSet(LS_KEY, U); invalidate(); TODAY = null; OUT = null; render(); if (stack.length && stack[stack.length-1].kind === "item") renderSheet(); }
    else if (local) doWrite();
    ref.onSnapshot(s => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const body = s.data(); const str = JSON.stringify(body);
      if (str === store.last) return;
      store.last = str; U = normU(body); lsSet(LS_KEY, U); invalidate(); render();
      if (stack.length && stack[stack.length-1].kind === "item") renderSheet();
    }, () => { store.ref = null; setSync(); });
  } catch (e) { store.ref = null; setSync(); }
}

/* =================== Démarrage =================== */
function boot(){
  const local = lsGet(LS_KEY); if (local){ U = normU(local); invalidate(); }
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    if (el.tagName === "LABEL") return;
    e.preventDefault(); act(el.dataset.act, el);
  });
  document.addEventListener("input", e => {
    if (e.target.id === "q"){ ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); if (q){ q.focus(); try { q.setSelectionRange(pos,pos); } catch(_){} } }
    else if (e.target.closest && e.target.closest("#pform") && e.target.type !== "file"){ readForm(); refreshPreview(); }
  });
  document.addEventListener("change", async e => {
    if (e.target.id === "sort"){ ui.sort = e.target.value; saveUI(); render(); }
    else if (e.target.id === "f-cat"){ readForm(); renderSheet(); }
    else if (e.target.id === "f-photo" && e.target.files && e.target.files[0]){
      readForm();
      try { const r = await readPhoto(e.target.files[0]); draft.photo = r.thumb; draft.fam = r.fam; draft.hex = r.hex; draft.detected = r.fam; renderSheet(); }
      catch(err){ toast("Photo illisible, essaie une autre image"); }
    }
    else if (e.target.id === "filein" && e.target.files && e.target.files[0]){
      const txt = await e.target.files[0].text(); e.target.value = "";
      const r = importData(txt); if (typeof r === "string") toast(r); else { closeSheet(); render(); toast(r.msg); }
    }
    else if (e.target.closest && e.target.closest("#pform")){ readForm(); refreshPreview(); }
  });
  document.addEventListener("submit", e => { if (e.target.id === "pform"){ e.preventDefault(); submitForm(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && stack.length) closeSheet(); });
  render();
  initStore();
  if (ui.wxMode === "auto") fetchWeather(false);
  if (!window.claude && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (typeof document !== "undefined") boot();
</script>
